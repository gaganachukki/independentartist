<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - STACKLY</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body { background: #F3F4F6; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar {
            width: 250px;
            background: white;
            border-right: 1px solid #E5E7EB;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }
        
        .brand {
            padding: 0 20px 20px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--clr-primary);
            border-bottom: 1px solid #E5E7EB;
            margin-bottom: 20px;
        }
        
        .nav-item {
            padding: 12px 20px;
            color: var(--clr-text-light);
            display: block;
            font-weight: 500;
            transition: var(--transition-fast);
        }
        
        .nav-item:hover, .nav-item.active {
            background: var(--clr-primary-light);
            color: var(--clr-primary);
            border-right: 3px solid var(--clr-primary);
        }
        
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: var(--border-radius-sm);
            box-shadow: var(--shadow-sm);
        }
        
        .stat-title { color: var(--clr-text-light); font-size: 0.9rem; margin-bottom: 10px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--clr-text-dark); }
        
        .data-table {
            width: 100%;
            background: white;
            border-radius: var(--border-radius-sm);
            box-shadow: var(--shadow-sm);
            border-collapse: collapse;
        }
        
        .data-table th, .data-table td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #E5E7EB;
        }
        
        .data-table th { background: #F9FAFB; font-weight: 600; color: var(--clr-text-light); }
        
        .status { padding: 4px 8px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
        .status.active { background: #D1FAE5; color: #065F46; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand"><img src="assets/images/logo.webp" alt="STACKLY Admin" style="height: 40px; margin-top: 10px;"></div>
        <a href="#" class="nav-item active">Dashboard</a>
        <a href="#" class="nav-item">Artists</a>
        <a href="#" class="nav-item">Clients</a>
        <a href="#" class="nav-item">Bookings</a>
        <a href="index.html" class="nav-item" style="margin-top: auto;">Logout</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h2>Dashboard Overview</h2>
            <div>Admin User</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Artists</div>
                <div class="stat-value">1,245</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Clients</div>
                <div class="stat-value">8,932</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Revenue</div>
                <div class="stat-value">₹12.4M</div>
            </div>
        </div>
        
        <h3 style="margin-bottom: 15px;">Recent Artists</h3>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Artist Name</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alex Morgan</td>
                    <td>Photography</td>
                    <td><span class="status active">Active</span></td>
                    <td><button class="btn btn-outline" style="padding: 5px 10px;">View</button></td>
                </tr>
                <tr>
                    <td>David Chen</td>
                    <td>Music</td>
                    <td><span class="status active">Active</span></td>
                    <td><button class="btn btn-outline" style="padding: 5px 10px;">View</button></td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
